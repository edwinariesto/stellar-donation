name: Soroban Smart Contract CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    name: Run Soroban Tests & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.84.0"
          targets: wasm32v1-none
          # Menambahkan komponen formatting dan clippy (linter)
          components: rustfmt, clippy 

      # Menggunakan action khusus Rust Cache agar lebih efisien dan rapi
      # daripada mengatur path cache secara manual
      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "contracts/donation -> target"

      - name: Check Code Formatting
        working-directory: contracts/donation
        run: cargo fmt -- --check

      - name: Run Clippy (Linting)
        working-directory: contracts/donation
        # Run clippy but don't treat all warnings as errors in CI until code is fixed
        run: cargo clippy --all-targets

      - name: Run Contract Tests
        working-directory: contracts/donation
        run: cargo test

      - name: Build Wasm Release
        working-directory: contracts/donation
        # Memastikan contract benar-benar bisa di-compile menjadi file .wasm
        run: cargo build --target wasm32v1-none --release

